name: docker
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Spleeter version to build image for"
        required: true
        default: "2.1.2"

permissions:
  contents: read
  packages: write

env:
  BASE_IMAGE: "ghcr.io/${{ github.repository }}/base/python-cuda-10-1"
  IMAGE_CPU: "ghcr.io/${{ github.repository }}/spleeter"
  IMAGE_GPU: "ghcr.io/${{ github.repository }}/spleeter-gpu"

jobs:
  cuda-base:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distribution: [3.6, 3.7, 3.8]
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BASE_IMAGE }}
          flavor: |
            prefix=${{ matrix.distribution }}-
          tags: |
            type=raw,value=${{ matrix.distribution }}
            type=sha
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          file: docker/cuda-10-1.dockerfile
          build-args: |
            BASE=python:${{ matrix.distribution }}
            SPLEETER_VERSION=${{ github.event.inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
  pip-images:
    needs: cuda-base
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [cpu, gpu]
        distribution: [3.6, 3.7, 3.8]
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Define image
        id: image
        run: |
          echo "base=${{ matrix.platform == 'cpu' && 'python' || env.BASE_IMAGE }}:${{ matrix.distribution }}" >> $GITHUB_OUTPUT
          echo "image=${{ matrix.platform == 'cpu' && env.IMAGE_CPU || env.IMAGE_GPU }}" >> $GITHUB_OUTPUT
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          flavor: |
            prefix=${{ matrix.distribution }}-
            latest=${{ matrix.distribution == '3.8' }}
          tags: |
            type=raw,value=${{ matrix.distribution }},prefix=
            type=sha
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          load: true
          file: docker/spleeter.dockerfile
          build-args: |
            BASE=${{ steps.image.outputs.base }}
            SPLEETER_VERSION=${{ github.event.inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test deezer/${{ steps.image.outputs.image }}:${{ matrix.distribution }} image
        run: |
          docker run \
            -v $(pwd):/runtime \
            deezer/${{ steps.image.outputs.image }}:${{ matrix.distribution }} \
            separate -o /tmp /runtime/audio_example.mp3
  conda-images:
    needs: cuda-base
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [cpu, gpu]
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Define image
        id: image
        run: |
          echo "base=${{ matrix.platform == 'cpu' && 'python' || env.BASE_IMAGE }}:3.8" >> $GITHUB_OUTPUT
          echo "image=${{ matrix.platform == 'cpu' && env.IMAGE_CPU || env.IMAGE_GPU }}" >> $GITHUB_OUTPUT
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          flavor: |
            prefix=conda-
            latest=false
          tags: |
            type=raw,value=conda,prefix=
            type=sha
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          push: false
          file: docker/conda.dockerfile
          build-args: |
            BASE=${{ steps.image.outputs.base }}
            SPLEETER_VERSION=${{ github.event.inputs.version }}
          tags: conda:${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          file: docker/spleeter-conda.dockerfile
          build-args: |
            BASE=conda:${{ matrix.platform }}
            SPLEETER_VERSION=${{ github.event.inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
  images-with-model:
    needs: [pip-images, conda-images]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [cpu, gpu]
        distribution: [3.6, 3.7, 3.8]
        model: [2stems, 4stems, 5stems]
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Define image
        id: image
        run: |
          echo "base=${{ matrix.platform == 'cpu' && 'python' || env.BASE_IMAGE }}:${{ matrix.distribution }}" >> $GITHUB_OUTPUT
          echo "image=${{ matrix.platform == 'cpu' && env.IMAGE_CPU || env.IMAGE_GPU }}" >> $GITHUB_OUTPUT
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          flavor: |
            prefix=${{ matrix.distribution }}-${{ matrix.model }}-
            latest=false
          tags: |
            type=raw,value=${{ matrix.distribution }}-${{ matrix.model }},prefix=
            type=sha
            type=schedule
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          load: true
          file: docker/spleeter-model.dockerfile
          build-args: |
            BASE=${{ steps.image.outputs.base }}
            MODEL=${{ matrix.model }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test deezer/${{ steps.image.outputs.image }}:${{ matrix.distribution }}-${{ matrix.model }} image
        run: |
          docker run \
            -v $(pwd):/runtime \
            deezer/${{ steps.image.outputs.image }}:${{ matrix.distribution }}-${{ matrix.model }} \
            separate -o /tmp -p spleeter:${{ matrix.model }} /runtime/audio_example.mp3
